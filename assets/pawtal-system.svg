<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title"><title id="title">Pawtal system diagram</title><rect width="960" height="600" fill="#fffaf0"/><g font-family="Tahoma,sans-serif" text-anchor="middle" fill="#432951"><text x="480" y="64" font-size="38">Pawtal · จากภาพถ่ายถึงเบาะแส</text><g fill="#ede2f5"><rect x="290" y="104" width="380" height="70" rx="16"/><rect x="45" y="243" width="390" height="100" rx="16"/><rect x="525" y="243" width="390" height="100" rx="16"/></g><g fill="#fcdfa0"><rect x="45" y="421" width="390" height="100" rx="16"/><rect x="525" y="421" width="390" height="100" rx="16"/></g><g stroke="#674976" stroke-width="3" fill="none"><path d="M480 174v34H240v32m-7 -9 7 9 7 -9 M480 208h240v32m-7 -9 7 9 7 -9 M240 343v75m-7 -9 7 9 7 -9 M720 343v75m-7 -9 7 9 7 -9"/></g><g font-size="23"><text x="480" y="147">ผู้ใช้ส่งภาพสัตว์ผ่านหน้าเว็บ</text><text x="240" y="282">ตรวจจับด้วย YOLO</text><text x="240" y="317">ระบุชนิดและตำแหน่งกรอบ</text><text x="720" y="282">ครอปภาพและสกัดลักษณะสัตว์</text><text x="720" y="317">เทียบกับภาพในประกาศที่เข้าถึงได้</text><text x="240" y="461">เทียบตำแหน่งกับโซน 5 มุม</text><text x="240" y="495">แสดง IN หรือ OUT</text><text x="720" y="461">จัดอันดับภาพที่คล้ายกัน</text><text x="720" y="495">ผู้ใช้เปิดประกาศเพื่อตรวจสอบ</text></g></g></svg>
